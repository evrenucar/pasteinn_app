<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paste Inn — Your inn</title><meta name="description" content="Paste Inn design preview: a simple capture space, a category wheel, and your recent saves."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23151d17'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-family='Georgia' font-size='29' fill='%23f4edda'%3Ep%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="concept.css"></head><body><header class="app-header"><a class="wordmark" href="landing.html" aria-label="Paste Inn landing page">paste inn<span>.</span></a><div class="header-actions"><button id="scene" type="button" aria-pressed="false">Demo saves</button><button id="about-preview" type="button" aria-label="About this preview" class="icon-button">i</button></div></header>
<main><section class="capture-area"><div class="capture-heading"><h1><img src="assets/a-little-space.png" alt="a little space." width="2170" height="725"></h1><div class="category-control"><div class="wheel-label"><span>SAVE TO</span><span id="wheel-hint">drag or flick</span></div><div class="wheel-shell"><div class="selection-line" aria-hidden="true"></div><div class="wheel" id="category-wheel" role="group" aria-label="Choose where to save. Drag, flick, or use arrow keys."><div class="wheel-padding" aria-hidden="true"></div><button class="wheel-item selected" type="button" data-category="inbox" aria-pressed="true"><span>⌑</span> Inbox</button><button class="wheel-item" type="button" data-category="ideas" aria-pressed="false"><span>✳</span> Ideas</button><button class="wheel-item" type="button" data-category="read" aria-pressed="false"><span>≋</span> Read later</button><button class="wheel-item" type="button" data-category="places" aria-pressed="false"><span>⌖</span> Places</button><button class="wheel-item" type="button" data-category="inspiration" aria-pressed="false"><span>▧</span> Inspiration</button><div class="wheel-padding" aria-hidden="true"></div></div><div class="wheel-arrows"><button id="previous-category" type="button" aria-label="Previous category">⌃</button><button id="next-category" type="button" aria-label="Next category">⌄</button></div></div></div></div>
<form class="composer" id="capture-form"><label class="sr-only" for="capture">Paste a link or write a note</label><textarea id="capture" rows="2" placeholder="Paste something here…"></textarea><div class="composer-bottom"><div class="capture-tools"><button type="button" data-planned="Attachments" aria-label="Add attachment — planned">＋</button><button type="button" data-planned="Camera" aria-label="Take photo — planned"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg></button><button type="button" data-planned="Voice notes" aria-label="Record voice — planned"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3"/></svg></button></div><button type="submit" class="save-button">Paste inn <span aria-hidden="true">↵</span></button></div></form><span id="category-status" class="sr-only" aria-live="polite">Saving to Inbox</span></section>
<section class="recents"><div class="recents-toolbar"><div class="recents-title"><h2>Recents</h2><button id="category-filter" aria-pressed="false" type="button">All chests</button></div><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input type="search" id="search" placeholder="Find a little something" aria-label="Search recent saves"></label></div><div id="items" aria-live="polite"></div></section></main><footer><span>Make yourself at home.</span><button id="appearance" type="button">After hours</button></footer>
<dialog id="detail"><form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form><span id="detail-type"></span><h2 id="detail-title"></h2><p id="detail-body"></p><a id="detail-link" target="_blank" rel="noopener" hidden>Open original</a></dialog><div class="toast" id="toast" role="status" hidden></div><script src="concept.js"></script></body></html>
